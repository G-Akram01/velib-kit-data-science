  <path d="M0 251H515" stroke="#74dfbd" stroke-opacity=".35" stroke-width="2"/>
  <text x="64" y="58" fill="#aee9d5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">DATA · IA · EXE710</text>
  <text x="64" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700">Vélib’ Métropole</text>
  <text x="64" y="185" fill="#c5f4e6" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400">Kit Data Science</text>
