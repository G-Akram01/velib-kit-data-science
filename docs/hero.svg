  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#102e34"/>
      <stop offset=".55" stop-color="#123c3d"/>
      <stop offset="1" stop-color="#17414d"/>
    </linearGradient>
    <linearGradient id="route" x2="1" y2="0">
      <stop stop-color="#56dbc0"/>
      <stop offset="1" stop-color="#94df78"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#d8fff2" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
