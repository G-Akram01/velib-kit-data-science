<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Vélib’ Métropole — Kit Data Science</title>
  <desc id="desc">Bannière vert foncé avec titrage à gauche et illustration vectorielle d’une station Vélib’ avec borne et trois vélos à droite.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3036"/>
      <stop offset="0.58" stop-color="#103e41"/>
      <stop offset="1" stop-color="#123c49"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d6bb"/>
      <stop offset="1" stop-color="#a1ea85"/>
    </linearGradient>
    <linearGradient id="bikePaint" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#90f4d0"/>
      <stop offset="1" stop-color="#30c5b6"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#205b61"/>
      <stop offset="1" stop-color="#33847d"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d9fff4" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="wheel">
      <circle cx="0" cy="0" r="25" fill="#0b3338" fill-opacity=".9" stroke="#b2e7d8" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="18.5" fill="none" stroke="#a0dcd0" stroke-opacity=".24" stroke-width="1.5"/>
      <path d="M-17 -10L17 10M-17 10L17 -10M0 -20V20M-20 0H20" stroke="#87bfba" stroke-opacity=".48" stroke-width="1.3"/>
      <circle r="4.1" fill="#cfffee"/>
    </g>
    <g id="bike">
      <use xlink:href="#wheel" x="0" y="0"/>
      <use xlink:href="#wheel" x="88" y="0"/>
      <!-- Curved fenders and fork -->
      <path d="M-22 -12A28 28 0 0 1 19 -21M65 -20A28 28 0 0 1 110 -7" fill="none" stroke="#77ddc8" stroke-width="3" stroke-linecap="round"/>
      <!-- Bicycle silhouette and diamond frame -->
      <path d="M0 0L28 -43L42 0L0 0M28 -43L72 -42L42 0M72 -42L88 0" fill="none" stroke="url(#bikePaint)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 -51L28 -43M66 -51L72 -42" fill="none" stroke="#defcf1" stroke-width="4" stroke-linecap="round"/>
      <path d="M12 -52H38" fill="none" stroke="#dbf8df" stroke-width="6" stroke-linecap="round"/>
      <path d="M63 -51L77 -52L83 -45" fill="none" stroke="#dafdeb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M42 0L47 11L58 11" fill="none" stroke="#cef3e3" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="42" cy="0" r="5.5" fill="#c8f5e6"/>
      <!-- Highlighted battery housing for bicycle-sharing appearance -->
      <path d="M28 -43L42 0" stroke="#b8fae8" stroke-width="9" stroke-linecap="round" opacity=".85"/>
      <rect x="8" y="-43" width="26" height="9" rx="4.5" fill="#103d45" stroke="#79e0c6" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <!-- Quiet environmental route graphic in upper-right background -->
  <path d="M651 65C717 27 764 84 820 49S928 19 1007 55S1106 48 1160 25" fill="none" stroke="#72dcc2" stroke-opacity=".07" stroke-width="38" stroke-linecap="round"/>
  <path d="M651 65C717 27 764 84 820 49S928 19 1007 55S1106 48 1160 25" fill="none" stroke="url(#mint)" stroke-opacity=".7" stroke-width="3" stroke-dasharray="6 12" stroke-linecap="round"/>
  <g fill="#92efd2" stroke="#cfffe9" stroke-width="2">
    <circle cx="820" cy="49" r="6"/>
    <circle cx="1007" cy="55" r="6"/>
  </g>

  <!-- Left-side editorial typography -->
  <text x="54" y="50" fill="#abeedb" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">DATA · IA · EXE710</text>
  <text x="54" y="143" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700">Vélib’ Métropole</text>
  <text x="56" y="198" fill="#d0f5e8" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400">Kit Data Science</text>
  <!-- Accent underline, no lower explanatory tagline -->
  <path d="M55 235H493" fill="none" stroke="url(#mint)" stroke-width="3" stroke-linecap="round" opacity=".7"/>

  <!-- Ground / street-level graphic -->
  <rect x="613" y="256" width="550" height="4" rx="2" fill="#84dcca" opacity=".42"/>
  <path d="M624 272H1157" stroke="#a9f3db" stroke-opacity=".12" stroke-width="1.5" stroke-dasharray="20 12"/>

  <!-- Subtle canopy over station -->
  <path d="M681 124Q907 99 1145 123" fill="none" stroke="#84daca" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/>
  <path d="M690 116Q914 90 1139 116" fill="none" stroke="#c3f6e4" stroke-opacity=".09" stroke-width="15" stroke-linecap="round"/>

  <!-- Rental terminal at the left of the three bicycles -->
  <g>
    <ellipse cx="649" cy="258" rx="37" ry="7" fill="#030d13" opacity=".35"/>
    <rect x="621" y="123" width="55" height="132" rx="12" fill="url(#pillar)" stroke="#96e7d0" stroke-width="2"/>
    <rect x="627" y="133" width="43" height="54" rx="6" fill="#0e2b33" stroke="#6cdbba" stroke-width="1.5"/>
    <rect x="633" y="139" width="31" height="34" rx="3" fill="#4bccac" opacity=".3"/>
    <path d="M640 156L647 163L659 148" fill="none" stroke="#b8f8d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="635" y="195" width="27" height="4" rx="2" fill="#bbf3df" opacity=".8"/>
    <rect x="635" y="206" width="27" height="4" rx="2" fill="#bbf3df" opacity=".4"/>
    <circle cx="649" cy="234" r="7" fill="#a2fbdc"/>
    <circle cx="649" cy="234" r="3" fill="#1a5559"/>
    <rect x="615" y="248" width="67" height="8" rx="4" fill="#3d7975"/>
  </g>

  <!-- Bicycle docking points behind the bikes -->
  <g fill="url(#pillar)" stroke="#8fe9ce" stroke-opacity=".75" stroke-width="1.5">
    <rect x="776" y="185" width="17" height="68" rx="8"/>
    <rect x="931" y="185" width="17" height="68" rx="8"/>
    <rect x="1087" y="185" width="17" height="68" rx="8"/>
  </g>
  <g fill="#b7ffdf">
    <circle cx="784.5" cy="194" r="3.2"/>
    <circle cx="939.5" cy="194" r="3.2"/>
    <circle cx="1095.5" cy="194" r="3.2"/>
  </g>

  <!-- Three distinct bicycle outlines, parked along docks -->
  <use xlink:href="#bike" x="697" y="228"/>
  <use xlink:href="#bike" x="852" y="228"/>
  <use xlink:href="#bike" x="1007" y="228"/>

  <!-- Small reflection under wheels -->
  <g fill="#96d8cf" opacity=".18">
    <ellipse cx="697" cy="258" rx="25" ry="3"/>
    <ellipse cx="785" cy="258" rx="25" ry="3"/>
    <ellipse cx="852" cy="258" rx="25" ry="3"/>
    <ellipse cx="940" cy="258" rx="25" ry="3"/>
    <ellipse cx="1007" cy="258" rx="25" ry="3"/>
    <ellipse cx="1095" cy="258" rx="25" ry="3"/>
  </g>
</svg>
