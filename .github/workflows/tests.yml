name: Tests Python

on:
  push:
    paths-ignore:
      - 'data/**'
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: python -m pip install -r requirements-collector.txt
      - run: python -m unittest discover -s tests -v
