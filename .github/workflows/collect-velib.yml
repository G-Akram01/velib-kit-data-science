name: Collecte Vélib toutes les 5 minutes

on:
  schedule:
    # Minutes 2, 7, 12, ... 57 UTC ; évite le début d'heure, souvent chargé.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velib-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Installer les dépendances minimales
        run: python -m pip install -r requirements-collector.txt

      - name: Collecter un instantané
        run: python -m src.collect_velib

      - name: Afficher la couverture de la collecte
        run: python -m src.audit_collection --hours 48

      - name: Versionner l'instantané
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/reference/ data/quality/
          if git diff --staged --quiet; then
            echo "Aucune modification"
            exit 0
          fi
          git commit -m "data: nouvel instantané Vélib [skip ci]"
          # L'absence d'une vraie garantie de ponctualité est documentée dans le README.
          git pull --rebase origin main
          git push origin HEAD:main
